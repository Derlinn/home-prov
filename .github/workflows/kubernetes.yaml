---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Kubernetes

on:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/**"
      - "scripts/validate-kubernetes.sh"
      - ".github/workflows/kubernetes.yaml"
      - ".mise.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SOPS files are encrypted
        run: ./scripts/check-sops-encrypted.sh

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      # Only the tools the script needs: a bare `mise install` would also build
      # Python and every CLI pinned for local cluster work.
      - name: Install tools
        run: mise install aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform aqua:helm/helm aqua:mikefarah/yq

      - name: Validate manifests
        run: mise exec aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform aqua:helm/helm aqua:mikefarah/yq -- ./scripts/validate-kubernetes.sh

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Kubernetes

on:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/**"
      - "scripts/validate-kubernetes.sh"
      - ".github/workflows/kubernetes.yaml"
      - ".mise.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SOPS files are encrypted
        run: ./scripts/check-sops-encrypted.sh

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      # Only the two tools the script needs: a bare `mise install` would also
      # build Python and every CLI pinned for local cluster work.
      - name: Install tools
        run: mise install aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform

      - name: Validate manifests
        run: mise exec aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform -- ./scripts/validate-kubernetes.sh

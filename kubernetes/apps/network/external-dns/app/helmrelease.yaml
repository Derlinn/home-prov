---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 1h
  values:
    provider:
      name: pdns
    policy: sync
    sources:
      - gateway-httproute
    txtOwnerId: external-dns
    txtPrefix: k8s.
    domainFilters:
      - ${DOMAIN}
    rbac:
      create: true
    serviceAccount:
      create: true
      name: external-dns
    podSecurityContext:
      runAsNonRoot: true
    logLevel: debug
    interval: 30s
    env:
      # kingpin exposes every flag as EXTERNAL_DNS_*; keeps the key out of args.
      - name: EXTERNAL_DNS_PDNS_API_KEY
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-secret
            key: PDNS_API_KEY
    extraArgs:
      - --pdns-server=https://power-dns.${DOMAIN}
      - --pdns-server-id=localhost
      - --gateway-name=envoy-internal
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret

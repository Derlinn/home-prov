---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
# rathole-client: egress to IONOS VPS (control channel) + headscale service
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-rathole-egress
spec:
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      app: rathole-client
      io.kubernetes.pod.namespace: network
  egress:
    - toCIDR:
        - 212.227.22.223/32
      toPorts:
        - ports:
            - port: "2333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: headscale
      toPorts:
        - ports:
            - port: "47239"
              protocol: TCP
---
# headscale: ingress from rathole-client (network namespace)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-headscale-from-rathole
spec:
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      app: headscale
      io.kubernetes.pod.namespace: headscale
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: rathole-client
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "47239"
              protocol: TCP

---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
# OSINT pods egress through the gluetun HTTP proxy in media-server. The
# default-deny blocks this cross-namespace traffic and
# allow-media-server-internal only covers media-server to media-server.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-osint-vpn-egress
spec:
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: default
      app.kubernetes.io/part-of: osint
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media-server
            app.kubernetes.io/name: vpn-stack
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-osint-vpn-ingress
spec:
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: media-server
      app.kubernetes.io/name: vpn-stack
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/part-of: osint
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP

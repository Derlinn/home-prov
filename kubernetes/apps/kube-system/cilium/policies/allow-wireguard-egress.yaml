---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
# Autorise gluetun (vpn-stack) à envoyer des paquets WireGuard UDP 51820 vers internet.
# Sans cette règle, le tunnel WireGuard s'établit silencieusement mais le trafic est bloqué.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-wireguard-egress
spec:
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vpn-stack
      io.kubernetes.pod.namespace: media-server
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP

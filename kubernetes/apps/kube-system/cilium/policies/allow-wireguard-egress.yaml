---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumnetworkpolicy_v2.json
# Lets gluetun (vpn-stack) send WireGuard UDP 51820 to the internet.
# Without it the tunnel comes up silently but no traffic passes.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-wireguard-egress
spec:
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vpn-stack
      io.kubernetes.pod.namespace: media-server
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mikrotik
spec:
  groups:
    - name: mikrotik.system
      rules:
        - alert: MikrotikDeviceReboot
          expr: mktxp_system_uptime < 300
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} rebooted (uptime {{ $value | humanizeDuration }})"

        - alert: MikrotikHighCPU
          expr: mktxp_system_cpu_load > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} high CPU ({{ $value }}%)"

        - alert: MikrotikHighMemory
          expr: mktxp_system_free_memory / mktxp_system_total_memory * 100 < 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} low memory ({{ $value | humanizePercentage }} free)"

        - alert: MikrotikLowDiskSpace
          # A percentage, not an absolute size: the fleet ranges from 16 MiB of
          # flash on the CRS326 to 1 GiB on the RB5009, so any fixed threshold
          # either never fires or never clears.
          expr: mktxp_system_free_hdd_space / mktxp_system_total_hdd_space * 100 < 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} low disk space ({{ $value | printf \"%.1f\" }} % free)"

        - alert: MikrotikHighTemperature
          expr: mktxp_system_cpu_temperature > 70 or mktxp_system_board_temperature1 > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} high temperature ({{ $value }}°C)"

        - alert: MikrotikCriticalTemperature
          expr: mktxp_system_cpu_temperature > 80 or mktxp_system_board_temperature1 > 80
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.routerboard_name }} critical temperature ({{ $value }}°C) — hardware at risk"

        - alert: MikrotikVoltageAnomaly
          expr: mktxp_system_routerboard_voltage < 10 or mktxp_system_routerboard_voltage > 28
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.routerboard_name }} abnormal voltage ({{ $value }}V)"

    - name: mikrotik.network
      rules:
        - alert: MikrotikInterfaceDown
          expr: |
            (mktxp_interface_running{name=~"(ether[0-9]|sfp).*", name!~"ether6.*|ether8.*|ether24.*"} == 0)
            UNLESS on(name, routerboard_name)
            (mktxp_interface_disabled{name=~"(ether[0-9]|sfp).*", name!~"ether6.*|ether8.*|ether24.*"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.routerboard_name }} physical interface {{ $labels.name }} is down"

        - alert: MikrotikLinkFlapping
          expr: increase(mktxp_link_downs_total[10m]) > 5
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} interface {{ $labels.name }} flapping ({{ $value }} drops in 10min)"

        - alert: MikrotikWANSaturated
          expr: |
            (
              rate(mktxp_interface_rx_byte_total{name=~".*::WAN", routerboard_name="RB5009"}[5m]) * 8
              + rate(mktxp_interface_tx_byte_total{name=~".*::WAN", routerboard_name="RB5009"}[5m]) * 8
            )
            / on(name, routerboard_name)
            (mktxp_interface_rate{name=~".*::WAN", routerboard_name="RB5009"} * 1000000)
            > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "RB5009 WAN saturated ({{ $value | humanizePercentage }} of {{ $labels.name }})"

        - alert: MikrotikTrunkSaturated
          expr: |
            (
              rate(mktxp_interface_rx_byte_total{name=~".*SWI.*|sfp.*"}[5m]) * 8
              + rate(mktxp_interface_tx_byte_total{name=~".*SWI.*|sfp.*"}[5m]) * 8
            )
            / on(name, routerboard_name)
            (mktxp_interface_rate{name=~".*SWI.*|sfp.*"} * 1000000)
            > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} trunk link {{ $labels.name }} saturated ({{ $value | humanizePercentage }})"

        - alert: MikrotikHighConnections
          expr: mktxp_ip_connections_total > 50000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} high IP connection count ({{ $value }})"

        - alert: MikrotikSwitchFCSErrors
          expr: rate(mktxp_switch_rx_fcs_error_total[5m]) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} port {{ $labels.name }} FCS errors (faulty cable or transceiver?)"

        - alert: MikrotikSwitchHighDrops
          expr: |
            rate(mktxp_switch_rx_drop_total[5m]) + rate(mktxp_switch_tx_drop_total[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} port {{ $labels.name }} high drops ({{ $value | humanize }}/s)"

        - alert: MikrotikSwitchBufferOverflow
          expr: rate(mktxp_switch_rx_overflow_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} port {{ $labels.name }} buffer overflow — switch congestion"

    - name: mikrotik.services
      rules:
        - alert: MikrotikBGPSessionDown
          expr: mktxp_bgp_established == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.routerboard_name }} BGP session {{ $labels.name }} is down"

        - alert: MikrotikDHCPPoolNearlyFull
          expr: mktxp_ip_pool_used > 200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} DHCP pool {{ $labels.pool }} nearly full ({{ $value }} leases)"

        - alert: MikrotikCAPsManAllAPsOffline
          expr: count(mktxp_capsman_remote_caps_info{routerboard_name="RB5009"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "RB5009 — no CAPsMAN AP registered"

        - alert: MikrotikCAPsManAPLost
          expr: |
            count(mktxp_capsman_remote_caps_info{routerboard_name="RB5009"})
            < count(mktxp_capsman_remote_caps_info{routerboard_name="RB5009"} offset 10m)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "RB5009 — a CAPsMAN AP disappeared ({{ $value }} AP(s) registered)"

        - alert: MikrotikBlacklistRapidGrowth
          expr: |
            increase(mktxp_firewall_address_list_selected_count{name="AL::BLACKLIST"}[1h]) > 50
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} blacklist growing rapidly (+{{ $value }} entries in 1h — scan or attack in progress?)"

        - alert: MikrotikRoutingProcessHighMemory
          expr: mktxp_routing_stats_private_mem > 104857600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.routerboard_name }} routing process high memory ({{ $value | humanize1024 }}B)"

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
spec:
  route:
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
    receiver: discord
    routes:
      - receiver: heartbeat
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
        groupWait: 0s
        groupInterval: 5m
        repeatInterval: 5m
      # InfoInhibitor only exists to suppress other alerts, it is never
      # something to read.
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      # asustor-1022t is a two-bay NAS running a single disk: md0 and md126 are
      # two-disk mirrors and will report degraded forever. Nothing to act on,
      # and a permanently firing alert is how a notification channel stops
      # being read. Remove this route the day a second disk goes in.
      - receiver: "null"
        matchers:
          - name: alertname
            value: NodeRAIDDegraded
            matchType: "="
          - name: instance
            value: asustor-1022t
            matchType: "="
      # The NAS steps its clock once a day instead of running an NTP daemon, so
      # the kernel keeps STA_UNSYNC set and this alert can never clear, even
      # though the clock measures within 50 ms of Prometheus. AsustorClockDrift
      # watches the offset itself, which is what actually breaks TOTP.
      - receiver: "null"
        matchers:
          - name: alertname
            value: NodeClockNotSynchronising
            matchType: "="
          - name: instance
            value: asustor-1022t
            matchType: "="
  receivers:
    - name: "null"
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: address
          sendResolved: true
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: alertmanager-heartbeat
            key: url
          sendResolved: false
  # Restores the defaults the chart ships with its own config: without them a
  # critical alert is duplicated by its warning counterpart.
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning|info
          matchType: "=~"
      equal: ["namespace", "alertname"]
    - sourceMatch:
        - name: severity
          value: warning
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["namespace", "alertname"]
    - sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["namespace"]

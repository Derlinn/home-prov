---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
spec:
  route:
    groupBy: ["alertname", "namespace"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
    receiver: discord
    routes:
      - receiver: heartbeat
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
        groupWait: 0s
        groupInterval: 5m
        repeatInterval: 5m
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: address
          sendResolved: true
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: alertmanager-heartbeat
            key: url
          sendResolved: false

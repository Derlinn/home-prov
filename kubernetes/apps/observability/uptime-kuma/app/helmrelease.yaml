---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
spec:
  chart:
    spec:
      chart: uptime-kuma
      version: '4.0.0'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: observability
  releaseName: uptime-kuma
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      # `repository` is what Renovate needs: without it, it only sees a bare
      # version string with no way to tell which image it belongs to, and skips
      # the tag. That is what kept this app pinned to 2.1.1 for months.
      repository: louislam/uptime-kuma
      tag: "2.5.0"

    # The database is a SQLite file on a RWO PVC. With RollingUpdate the new pod
    # starts before the old one stops: on a single-node cluster both mount the
    # same volume and write to the same database. Recreate guarantees a single
    # process at a time, at the cost of a few seconds of downtime.
    strategy:
      type: Recreate

    podEnv:
      - name: TZ
        value: "Europe/Paris"

    volume:
      enabled: true
      storageClassName: longhorn-production-v1
      accessMode: ReadWriteOnce
      size: 1Gi

    serviceMonitor:
      enabled: true
      interval: 60s

    service:
      type: ClusterIP
      port: 3001

    ingress:
      enabled: false

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
spec:
  chart:
    spec:
      chart: uptime-kuma
      version: '4.0.0'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: observability
  releaseName: uptime-kuma
  interval: 1h
  values:
    image:
      # `repository` est indispensable a Renovate : sans lui il ne voit qu'une
      # chaine de version sans savoir de quelle image il s'agit, et ignore le
      # tag. C'est ce qui a fige cette app en 2.1.1 pendant des mois.
      repository: louislam/uptime-kuma
      tag: "2.5.0"

    # La base est un fichier SQLite sur un PVC RWO. En RollingUpdate, le nouveau
    # pod demarre avant l'arret de l'ancien : sur un noeud unique les deux
    # montent le meme volume et ecrivent dans la meme base. Recreate garantit un
    # seul processus a la fois, au prix de quelques secondes d'indisponibilite.
    strategy:
      type: Recreate

    podEnv:
      - name: TZ
        value: "Europe/Paris"

    volume:
      enabled: true
      storageClassName: longhorn-production-v1
      accessMode: ReadWriteOnce
      size: 1Gi

    serviceMonitor:
      enabled: true
      interval: 60s

    service:
      type: ClusterIP
      port: 3001

    ingress:
      enabled: false

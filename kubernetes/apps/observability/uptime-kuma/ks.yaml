---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# DEPRECATED (2026-08-11): replaced by Gatus (../gatus/).
# Not referenced in ../kustomization.yaml, so Flux never reconciles it;
# `suspend: true` guards against it being re-added without review.
# Delete once Gatus is proven in production.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  annotations:
    lifecycle.home-prov/status: deprecated
    lifecycle.home-prov/deprecated-since: "2026-08-11"
    lifecycle.home-prov/replaced-by: gatus
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/observability/uptime-kuma/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
  timeout: 10m

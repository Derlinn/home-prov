---
metrics: true

storage:
  type: sqlite
  path: /data/data.db

ui:
  title: Status | Linderis
  header: Linderis
  description: État des services de l'infrastructure Linderis

endpoints:
  # --- infrastructure ---------------------------------------------------
  - name: Grafana
    group: infrastructure
    url: https://grafana.${DOMAIN}
    interval: 60s
    conditions: &http-2xx
      - "[STATUS] >= 200"
      - "[STATUS] < 300"
    alerts: &discord-alert
      - type: discord

  - name: Prometheus
    group: infrastructure
    url: https://prometheus.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Longhorn
    group: infrastructure
    url: https://longhorn.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Authentik
    group: infrastructure
    url: https://authentik.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  # --- Network ----------------------------------------------------------
  - name: PowerDNS
    group: Réseau
    url: https://power-dns.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Adguard
    group: Réseau
    url: https://adguard.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  # --- Security ---------------------------------------------------------
  - name: Vaultwarden
    group: Sécurité
    url: https://vaultwarden.${DOMAIN}/alive
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  # --- Applications -----------------------------------------------------
  - name: Netbox
    group: Applications
    url: https://netbox.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: BenToPDF
    group: Applications
    url: https://bentopdf.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  # --- Media ------------------------------------------------------------
  - name: Jellyfin
    group: Media
    url: https://jellyfin.${DOMAIN}/health
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Jellyseerr
    group: Media
    url: https://jellyseerr.${DOMAIN}/api/v1/status
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Sonarr
    group: Media
    url: https://sonarr.${DOMAIN}/ping
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Radarr
    group: Media
    url: https://radarr.${DOMAIN}/ping
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Prowlarr
    group: Media
    url: https://prowlarr.${DOMAIN}/ping
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Bazarr
    group: Media
    url: https://bazarr.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: qBittorrent
    group: Media
    url: https://qbit.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  # --- Hardware ---------------------------------------------------------
  - name: LIN-NAS-01
    group: Hardware
    url: icmp://10.25.30.1
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts: *discord-alert

  - name: LIN-PVE-01
    group: Hardware
    url: tcp://10.25.30.20:8006
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts: *discord-alert

  # --- Home automation --------------------------------------------------
  - name: Home Assistant
    group: Domotique
    url: https://ha.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  - name: Zigbee2MQTT
    group: Domotique
    url: https://z2m.${DOMAIN}
    interval: 60s
    conditions: *http-2xx
    alerts: *discord-alert

  # --- DNS --------------------------------------------------------------
  - name: DNS interne
    group: Réseau
    url: 10.25.30.4
    dns:
      query-name: grafana.${DOMAIN}
      query-type: A
    interval: 60s
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == 10.25.50.126"
    alerts: *discord-alert

  - name: DNS récursif
    group: Réseau
    url: 10.25.30.4
    dns:
      query-name: cloudflare.com
      query-type: A
    interval: 60s
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts: *discord-alert

  # --- Certificates -----------------------------------------------------
  - name: Certificat TLS
    group: Sécurité
    url: https://grafana.${DOMAIN}
    interval: 1h
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts: *discord-alert

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml

configMapGenerator:
  - name: gatus-config
    files:
      - ./config/config.yaml

# Gatus reads its configuration once at startup. A stable ConfigMap name lets
# Reloader restart the pod on change; a hashed name would make the HelmRelease
# reference a ConfigMap that no longer exists.
generatorOptions:
  disableNameSuffixHash: true

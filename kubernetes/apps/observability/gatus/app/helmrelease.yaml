---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  values:
    controllers:
      gatus:
        annotations:
          reloader.stakater.com/auto: "true"
        # SQLite file on a RWO Longhorn volume. With RollingUpdate the new pod
        # starts before the old one stops and both mount the same volume, which
        # corrupts the database. Recreate guarantees a single writer.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.36.0
            env:
              TZ: Europe/Paris
              GATUS_CONFIG_PATH: /config/config.yaml
              DISCORD_WEBHOOK_URL:
                valueFrom:
                  secretKeyRef:
                    name: gatus-discord
                    key: DISCORD_WEBHOOK_URL
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # The ICMP endpoint (LIN-NAS-01) uses an unprivileged datagram socket
        # instead of CAP_NET_RAW, which only works if the pod GID is inside
        # ping_group_range.
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "1000 1000"

    service:
      app:
        controller: gatus
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 60s

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      config:
        type: configMap
        name: gatus-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: pve-exporter
          image: ghcr.io/prometheus-pve/prometheus-pve-exporter:3.5.5
          args:
            - --config.file=/etc/pve/pve.yml
            - --web.listen-address=0.0.0.0:9221
          ports:
            - name: metrics
              containerPort: 9221
          volumeMounts:
            - name: config
              mountPath: /etc/pve
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 192Mi
      volumes:
        - name: config
          secret:
            secretName: pve-exporter-config

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/notifications/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  # This directory is applied by the bootstrap (`kubectl apply -k`), not by
  # cluster-apps, so the global SOPS patch never reaches it: the decryption has
  # to be declared here or the webhook secret lands as a literal ENC[...] string.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osint-cli
  namespace: default
  labels:
    app.kubernetes.io/name: osint-cli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: osint-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osint-cli
        app.kubernetes.io/part-of: osint
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: cli
          image: docker.io/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --user user-scanner ignorant
              && exec sleep infinity
          env:
            - name: HOME
              value: /home/osint
            - name: PATH
              value: /home/osint/.local/bin:/usr/local/bin:/usr/bin:/bin
            # Lowercase duplicates required: user-scanner uses curl_cffi, and
            # libcurl ignores the uppercase HTTP_PROXY (httpoxy mitigation).
            - name: HTTP_PROXY
              value: http://vpn-stack.media-server.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-stack.media-server.svc.cluster.local:8888
            - name: http_proxy
              value: http://vpn-stack.media-server.svc.cluster.local:8888
            - name: https_proxy
              value: http://vpn-stack.media-server.svc.cluster.local:8888
            - name: NO_PROXY
              value: 10.0.0.0/8,192.168.0.0/16,localhost,127.0.0.1,.svc.cluster.local
            - name: no_proxy
              value: 10.0.0.0/8,192.168.0.0/16,localhost,127.0.0.1,.svc.cluster.local
          workingDir: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /data
            - name: home
              mountPath: /home/osint
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: osint-cli-results
        - name: home
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maigret
  namespace: default
  labels:
    app.kubernetes.io/name: maigret
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maigret
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maigret
        app.kubernetes.io/part-of: osint
        vpn-proxy-client: "true"
        egress: vpn-only
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: maigret
          image: docker.io/soxoj/maigret:web-fbda9cd
          imagePullPolicy: IfNotPresent
          env:
            # Egress through the gluetun HTTP proxy; aiohttp sessions are built
            # with trust_env=True, so these are honoured.
            - name: HTTP_PROXY
              value: http://vpn-proxy.network.svc.cluster.local:8888
            - name: HTTPS_PROXY
              value: http://vpn-proxy.network.svc.cluster.local:8888
            - name: NO_PROXY
              value: 10.0.0.0/8,192.168.0.0/16,localhost,127.0.0.1,.svc.cluster.local
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: reports
              mountPath: /app/reports
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: maigret-reports

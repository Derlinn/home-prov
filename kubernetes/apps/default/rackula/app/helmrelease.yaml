---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rackula
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: default
  releaseName: rackula
  interval: 1h
  values:
    controllers:
      main:
        pod:
          # The image declares a non-numeric user, so runAsNonRoot cannot be set:
          # the kubelet would refuse to start a container it cannot verify.
          securityContext:
            fsGroup: 101
        containers:
          app:
            image:
              repository: ghcr.io/rackulalives/rackula
              tag: v26.8.0-persist
            env:
              # nginx resolves the upstream at request time: FQDN + cluster DNS IP required
              API_HOST: rackula-api.default.svc.cluster.local
              API_PORT: "3001"
              NGINX_RESOLVER: 10.43.0.10
              RACKULA_LISTEN_PORT: "8080"
              RACKULA_STORAGE_MODE: server
              # Authentication is enforced by the SecurityPolicy on the gateway.
              RACKULA_AUTH_MODE: none
              RACKULA_TRUST_PROXY: "1"
              RACKULA_BASE_URL: https://rackula.${DOMAIN}
              API_WRITE_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: rackula-secret
                    key: RACKULA_API_WRITE_TOKEN
            probes:
              liveness: &frontendProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 20
              readiness: *frontendProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 200m
                memory: 128Mi
      api:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
        containers:
          api:
            image:
              repository: ghcr.io/rackulalives/rackula-api
              tag: "26.7.0"
            env:
              DATA_DIR: /data
              RACKULA_API_PORT: "3001"
              CORS_ORIGIN: https://rackula.${DOMAIN}
              ALLOW_INSECURE_CORS: "false"
              # The API parses this as a boolean, the nginx frontend as 0/1.
              RACKULA_TRUST_PROXY: "true"
              RACKULA_BASE_URL: https://rackula.${DOMAIN}
              RACKULA_AUTH_MODE: none
              RACKULA_API_WRITE_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: rackula-secret
                    key: RACKULA_API_WRITE_TOKEN
            probes:
              liveness: &apiProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3001
                  initialDelaySeconds: 15
                  periodSeconds: 30
              readiness: *apiProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi

    service:
      main:
        controller: main
        nameOverride: rackula
        ports:
          http:
            port: 80
            targetPort: 8080
      api:
        controller: api
        nameOverride: api
        ports:
          http:
            port: 3001

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          api:
            api:
              - path: /data
      nginx-cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          main:
            app:
              - path: /var/cache/nginx
      nginx-run:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Mi
        advancedMounts:
          main:
            app:
              - path: /var/run
      nginx-conf:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Mi
        advancedMounts:
          main:
            app:
              - path: /etc/nginx/conf.d
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Mi
        globalMounts:
          - path: /tmp

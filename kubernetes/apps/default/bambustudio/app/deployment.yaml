---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambustudio
  namespace: default
  labels:
    app.kubernetes.io/name: bambustudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bambustudio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bambustudio
    spec:
      containers:
        - name: bambustudio
          image: lscr.io/linuxserver/bambustudio:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1.5Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bambustudio-config

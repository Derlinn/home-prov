---
- resources:
    label: Cluster
    cpu: true
    memory: true
    cputemp: false
    uptime: true

- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: lin-master-01
    nodes:
      show: false

# longhorn is an info widget, not a service one: it cannot be declared through
# a route annotation.
- longhorn:
    url: http://longhorn-frontend.longhorn-system.svc.cluster.local
    expanded: false
    total: true
    labels: true
    nodes: false

- search:
    provider: duckduckgo
    target: _blank

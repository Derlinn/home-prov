---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "GLPI"
    gethomepage.dev/group: "Applications"
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/glpi.svg"
    gethomepage.dev/href: "https://glpi.${DOMAIN}"
  name: glpi
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - glpi.${DOMAIN}
  rules:
    - backendRefs:
        - name: nginx
          namespace: default
          port: 80
      filters:
        # Envoy sets X-Forwarded-Proto but not X-Forwarded-Port; without it
        # the samlSSO plugin (proxyVars mode) rebuilds the ACS URL with the
        # backend port (:8080) and rejects the SAML response on Destination
        # mismatch.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"

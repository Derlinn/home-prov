---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inp-calendar-bot-updater
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inp-calendar-bot-updater
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["inp-calendar-bot"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["inp-calendar-bot-image-digest"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inp-calendar-bot-updater
  namespace: default
subjects:
  - kind: ServiceAccount
    name: inp-calendar-bot-updater
    namespace: default
roleRef:
  kind: Role
  name: inp-calendar-bot-updater
  apiGroup: rbac.authorization.k8s.io

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  chartRef:
    kind: OCIRepository
    name: netbox
  interval: 1h
  timeout: 20m # default 5min is too short for update
  values:
    global:
      storageClass: longhorn-production-v1
    timezone: 'Europe\Paris'
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 1536Mi
        ephemeral-storage: 2Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    superuser:
      existingSecret: netbox-superuser
    # Memory keeps a limit exceeding it kills the container instead of slowing
    # it down. Postgres was sitting at 169Mi against a 192Mi cap.
    postgresql:
      primary:
        resourcesPreset: "none"
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 384Mi
    valkey:
      enabled: true
      replica:
        replicaCount: 0
      primary:
        resourcesPreset: "none"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 192Mi
    persistence:
      enabled: true

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  chartRef:
    kind: OCIRepository
    name: netbox
  interval: 1h
  timeout: 20m # default 5min is too short for update
  values:
    global:
      storageClass: longhorn-production-v1
    replicaCount: 1
    worker:
      replicaCount: 1
    timezone: 'Europe\Paris'
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 1536Mi
        ephemeral-storage: 2Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    superuser:
      existingSecret: netbox-superuser
    # Memory keeps a limit exceeding it kills the container instead of slowing
    # it down. Postgres was sitting at 169Mi against a 192Mi cap.
    postgresql:
      # Bitnami only publishes `latest` on Docker Hub since 2025, so a digest is
      # the only way to pin. Currently 18.3.0.
      image:
        digest: sha256:228ef23ed3b9eb678ae557f3dcaf80fe1d217fb9e0a4fcb75279b2b2b858c3ff
      primary:
        resourcesPreset: "none"
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 384Mi
    valkey:
      enabled: true
      # Same as postgresql: digest-pinned. Currently 9.0.3.
      image:
        digest: sha256:c64a71d6d44c08c9fd5d7a4c4e23e85c8f7bd54ad782ca062e52a54c25b110a1
      replica:
        replicaCount: 0
      primary:
        resourcesPreset: "none"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 192Mi
    persistence:
      enabled: true

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  chartRef:
    kind: OCIRepository
    name: netbox
  interval: 1h
  values:
    timezone: 'Europe\Paris'
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    superuser:
      existingSecret: netbox-superuser
    persistence:
      enabled: true
      size: 5Gi

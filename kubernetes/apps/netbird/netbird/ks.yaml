---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird
spec:
  interval: 30m
  path: ./kubernetes/apps/netbird/netbird/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: netbird
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: netbird-server
      namespace: netbird
    - apiVersion: apps/v1
      kind: Deployment
      name: netbird-dashboard
      namespace: netbird

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-routing
spec:
  interval: 30m
  path: ./kubernetes/apps/netbird/routing/app
  prune: true
  timeout: 10m
  dependsOn:
    - name: netbird-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: netbird

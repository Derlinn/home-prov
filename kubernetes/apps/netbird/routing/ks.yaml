---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-routing
spec:
  interval: 30m
  path: ./kubernetes/apps/netbird/routing/app
  prune: true
  timeout: 10m
  # The CRDs ship with the operator chart, so nothing here can apply before it.
  dependsOn:
    - name: netbird-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: netbird

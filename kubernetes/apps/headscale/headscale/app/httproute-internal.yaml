---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Headscale control plane - internal access (subnet-router and in-cluster clients)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale-internal
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - headscale-01.${DOMAIN}
  rules:
    - backendRefs:
        - name: headscale
          namespace: headscale
          port: 47239

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  chart:
    spec:
      chart: vaultwarden
      version: '0.44.1'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
  releaseName: vaultwarden
  interval: 1h
  values:
    storage:
      data:
        name: "vaultwarden-data"
        size: "15Gi"
        class: "longhorn-encrypted-v1"
        accessMode: "ReadWriteOnce"
        keepPvc: true
    adminToken:
      existingSecret: vaultwarden-admin-token
      existingSecretKey: ADMIN_TOKEN
    sso:
      enabled: true
      # Must match the discovered issuer exactly; the chart's comment says to
      # strip the trailing slash, which breaks it.
      authority: https://authentik.${DOMAIN}/application/o/vaultwarden/
      # Without offline_access Authentik issues no refresh token.
      scopes: "email profile offline_access"
      existingSecret: vaultwarden-sso
      clientId:
        existingSecretKey: SSO_CLIENT_ID
      # The chart guards this env var on `sso.clientId.value`, so name it.
      clientSecret:
        existingSecretKey: SSO_CLIENT_SECRET
    replicas: 1
    domain: "https://vaultwarden.${DOMAIN}/"
    ingress:
      enabled: true
      hostname: vaultwarden.${DOMAIN}
    metrics:
      serviceMonitor:
        enabled: true
    timeZone: "Europe/Paris"
    image:
      extraVars:
        - key: LOGIN_RATELIMIT_SECONDS
          value: "1"
        - key: LOGIN_RATELIMIT_MAX_BURST
          value: "100"
        - key: ADMIN_RATELIMIT_SECONDS
          value: "1"
        - key: ADMIN_RATELIMIT_MAX_BURST
          value: "100"
  dependsOn:
    - name: envoy-gateway
      namespace: network

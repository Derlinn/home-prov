---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
spec:
  interval: 30m
  timeout: 20m
  releaseName: gitlab
  chart:
    spec:
      chart: gitlab
      version: 10.2.2
      sourceRef:
        kind: HelmRepository
        name: gitlab
      interval: 1h
  values:
    global:
      edition: ce
      hosts:
        domain: ${DOMAIN}
        https: true
        gitlab:
          name: gitlab.${DOMAIN}

      ingress:
        enabled: false
        configureCertmanager: false

      initialRootPassword:
        secret: gitlab-initial-root-password
        key: password

      appConfig:
        omniauth:
          enabled: true
          allowSingleSignOn: ['openid_connect']
          syncProfileFromProvider: ['openid_connect']
          syncProfileAttributes: ['email']
          blockAutoCreatedUsers: false
          providers:
            - secret: gitlab-authentik-oidc
              key: provider

    # Bundled ingress controller disabled - Envoy Gateway handles ingress
    nginx-ingress:
      enabled: false

    # `certmanager.install` is deprecated: the subchart's schema rejects it.
    installCertmanager: false
    certmanager-issuer:
      email: false

    # Bundled Prometheus disabled - kube-prometheus-stack is used instead
    prometheus:
      install: false

    # Bundled PostgreSQL and Redis
    postgresql:
      install: true

    redis:
      install: true

    # Bundled MinIO for artifacts, LFS and uploads
    minio:
      enabled: true
      ingress:
        enabled: false

    # Registry disabled for now (Harbor planned)
    registry:
      enabled: false

    gitlab:
      webservice:
        ingress:
          enabled: false
      kas:
        ingress:
          enabled: false
      pages:
        enabled: false

    gitlab-runner:
      install: false

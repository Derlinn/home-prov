# Créer dans Authentik UI :
#   - Provider OAuth2/OpenID Connect, redirect URI :
#     https://gitlab.linderis.fr/users/auth/openid_connect/callback
#   - Application avec le slug "gitlab"
# Puis remplir client_id et client_secret ci-dessous et chiffrer :
#   sops --encrypt --in-place authentik-oidc-secret.sops.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-authentik-oidc
type: Opaque
stringData:
  provider: |
    name: openid_connect
    label: "Authentik"
    args:
      name: "openid_connect"
      scope:
        - openid
        - profile
        - email
      response_type: "code"
      issuer: "https://authentik.linderis.fr/application/o/gitlab/"
      discovery: true
      client_auth_method: "query"
      uid_field: "preferred_username"
      pkce: true
      client_options:
        identifier: "CHANGEME_CLIENT_ID"
        secret: "CHANGEME_CLIENT_SECRET"
        redirect_uri: "https://gitlab.linderis.fr/users/auth/openid_connect/callback"

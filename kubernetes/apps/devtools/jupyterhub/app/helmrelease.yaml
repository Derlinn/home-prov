---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jupyterhub
spec:
  interval: 30m
  timeout: 20m
  releaseName: jupyterhub
  chart:
    spec:
      chart: jupyterhub
      version: 4.4.2
      sourceRef:
        kind: HelmRepository
        name: jupyterhub
      interval: 1h
  valuesFrom:
    - kind: Secret
      name: jupyterhub-secrets
      valuesKey: cookie-secret
      targetPath: hub.cookieSecret
      optional: false
    - kind: Secret
      name: jupyterhub-secrets
      valuesKey: proxy-token
      targetPath: proxy.secretToken
      optional: false
    - kind: Secret
      name: jupyterhub-secrets
      valuesKey: client-id
      targetPath: hub.config.GenericOAuthenticator.client_id
      optional: false
    - kind: Secret
      name: jupyterhub-secrets
      valuesKey: client-secret
      targetPath: hub.config.GenericOAuthenticator.client_secret
      optional: false
  values:
    hub:
      # Access is gated by the Authentik application policy (linderis_jupyterhub
      # group), so no allowed_groups check is configured here.
      config:
        Authenticator:
          allow_all: true
          enable_auth_state: true
          manage_groups: true
          admin_groups:
            - linderis_jupyterhub_admins
        JupyterHub:
          authenticator_class: generic-oauth
          admin_access: true
          load_roles:
            - name: user
              scopes:
                - self
                - shares!user
                - read:users:name
                - read:groups:name
        GenericOAuthenticator:
          oauth_callback_url: https://jupyterhub.${DOMAIN}/hub/oauth_callback
          authorize_url: https://authentik.${DOMAIN}/application/o/authorize/
          token_url: https://authentik.${DOMAIN}/application/o/token/
          userdata_url: https://authentik.${DOMAIN}/application/o/userinfo/
          login_service: Authentik
          username_key: preferred_username
          scope:
            - openid
            - email
            - profile
      db:
        pvc:
          storage: 1Gi
          storageClassName: longhorn-production-v1
      extraConfig:
        00-block-guest-spawn: |
          # Guest accounts (batch-created via scripts/jupyterhub-invites.sh) work
          # on their shared groupe-K server and must not spawn personal servers.
          # Group rule mirrors the script: K = ceil(N/5) from the trailing
          # number (ensimag-1..5 -> groupe-1, ensimag-6..10 -> groupe-2, ...).
          import re

          BLOCKED_SPAWN_PREFIXES = ["ensimag-"]

          def shared_server_url(username):
              match = re.search(r"-(\d+)$", username)
              if not match:
                  return None
              group = (int(match.group(1)) + 4) // 5
              return f"https://jupyterhub.${DOMAIN}/user/groupe-{group}/lab"


          def shared_server_path(username):
              url = shared_server_url(username)
              if not url:
                  return ""
              return "/" + "/".join(url.split("/")[3:])


          def guest_default_url(handler):
              user = handler.current_user
              if user and any(
                  user.name.startswith(prefix) for prefix in BLOCKED_SPAWN_PREFIXES
              ):
                  return shared_server_path(user.name)
              return ""


          async def block_guest_spawn(spawner):
              username = spawner.user.name
              if any(username.startswith(prefix) for prefix in BLOCKED_SPAWN_PREFIXES):
                  url = shared_server_url(username)
                  hint = f" Please use your shared server: {url}" if url else ""
                  raise Exception(
                      f"Personal servers are disabled for guest account '{username}'.{hint}"
                  )

          c.JupyterHub.default_url = guest_default_url
          c.KubeSpawner.pre_spawn_hook = block_guest_spawn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      templatePaths:
        - /etc/jupyterhub/custom-templates
      extraFiles:
        home-template:
          mountPath: /etc/jupyterhub/custom-templates/home.html
          stringData: |
            {% extends "page.html" %}
            {% if announcement_home is string %}
              {% set announcement = announcement_home %}
            {% endif %}
            {# Guest accounts (ensimag-N) work on their shared groupe-K server
               with K = ceil(N/5). Show them a direct button and hide the
               personal Start button (spawn is blocked server-side anyway).
               Stock template copied from jupyterhub 5.5.2; re-check on chart upgrades. #}
            {% set _parts = user.name.rsplit('-', 1) %}
            {% set _is_guest = user.name.startswith('ensimag-') and _parts|length == 2 and _parts[1].isdigit() %}
            {% if _is_guest %}
              {% set _group = ((_parts[1]|int + 4) // 5) %}
            {% endif %}
            {% block main %}
              <div class="container">
                <h1 class="visually-hidden">JupyterHub home page</h1>
                {% if _is_guest %}
                  <div class="row mb-4">
                    <div class="text-center">
                      <a role="button"
                         class="btn btn-lg btn-success"
                         href="/user/groupe-{{ _group }}/lab">
                        Ouvrir mon serveur partagé (groupe-{{ _group }})
                      </a>
                    </div>
                  </div>
                {% endif %}
                <div class="row">
                  <div class="text-center">
                    {% if default_server.active %}<a id="stop" role="button" class="btn btn-lg btn-danger">Stop My Server</a>{% endif %}
                    {% if not _is_guest %}
                      <a id="start"
                         role="button"
                         class="btn btn-lg btn-primary"
                         href="{{ url }}">
                        {% if not default_server.active %}Start{% endif %}
                        My Server
                      </a>
                    {% endif %}
                  </div>
                </div>
                {% if allow_named_servers %}
                  <h2>Named Servers</h2>
                  <p>
                    In addition to your default server,
                    you may have additional
                    {% if named_server_limit_per_user > 0 %}{{ named_server_limit_per_user }}{% endif %}
                    server(s) with names.
                    This allows you to have more than one server running at the same time.
                  </p>
                  {% set named_spawners = user.all_spawners(include_default=False)|list %}
                  <table class="server-table table table-striped">
                    <thead>
                      <tr>
                        <th>Server name</th>
                        <th>URL</th>
                        <th>Last activity</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="home-server-row add-server-row">
                        <td colspan="4">
                          <div class="input-group">
                            <input class="new-server-name form-control"
                                   aria-label="server name"
                                   placeholder="name-your-server">
                            <button role="button"
                                    type="button"
                                    class="new-server-btn btn btn-xs btn-primary">Add New Server</button>
                          </div>
                        </td>
                      </tr>
                      {% for spawner in named_spawners %}
                        <tr class="home-server-row" data-server-name="{{ spawner.name }}">
                          {# name #}
                          <td>{{ spawner.name }}</td>
                          {# url #}
                          <td>
                            <a class="server-link {% if not spawner.ready %}hidden{% endif %}"
                               href="{{ user.server_url(spawner.name) }}">{{ user.server_url(spawner.name) }}</a>
                          </td>
                          {# activity #}
                          <td class='time-col'>
                            {% if spawner.last_activity %}
                              {{ spawner.last_activity.isoformat() + 'Z' }}
                            {% else %}
                              Never
                            {% endif %}
                          </td>
                          {# actions #}
                          <td>
                            <a role="button"
                               class="stop-server btn btn-xs btn-danger{% if not spawner.active %} hidden{% endif %}"
                               id="stop-{{ spawner.name }}">stop</a>
                            <a role="button"
                               class="start-server btn btn-xs btn-primary {% if spawner.active %}hidden{% endif %}"
                               id="start-{{ spawner.name }}"
                               href="{{ base_url }}spawn/{{ user.name }}/{{ spawner.name }}">start</a>
                            <button role="button"
                                    class="delete-server btn btn-xs btn-danger{% if spawner.active %} hidden{% endif %}"
                                    id="delete-{{ spawner.name }}">delete</button>
                          </td>
                        </tr>
                      {% endfor %}
                    </tbody>
                  </table>
                {% endif %}
              </div>
            {% endblock main %}
            {% block script %}
              {{ super() }}
              <script type="text/javascript">
                require(["home"]);
              </script>
            {% endblock script %}
    proxy:
      service:
        type: ClusterIP
      chp:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    singleuser:
      cloudMetadata:
        blockWithIptables: false
      image:
        name: quay.io/jupyter/datascience-notebook
        tag: "2026-07-28"
      storage:
        type: dynamic
        capacity: 10Gi
        dynamic:
          storageClass: longhorn-production-v1
          storageAccessModes:
            - ReadWriteOnce
      cpu:
        guarantee: 0.2
        limit: 2
      memory:
        guarantee: 512M
        limit: 3G
      startTimeout: 300
      extraEnv:
        PYTHONPATH: "/opt/puml"
      extraFiles:
        puml-helper:
          mountPath: /opt/puml/puml.py
          stringData: |
            """Render PlantUML diagrams from notebooks via the in-cluster server.

            Usage:
                from puml import puml

                puml("@startuml\\nAlice -> Bob: hello\\n@enduml")

            Or as a cell magic after running ``%load_ext puml`` once::

                %%puml
                @startuml
                Alice -> Bob: hello
                @enduml

            Only the Python standard library is used. Diagrams are rendered by
            the plantuml-server Service in the devtools namespace; point the
            PLANTUML_SERVER environment variable at another server to override.
            """
            import os
            import urllib.request
            import zlib

            SERVER_URL = os.environ.get(
                "PLANTUML_SERVER",
                "http://plantuml-server.devtools.svc.cluster.local",
            )

            _ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_"


            def _encode_char(byte):
                return _ALPHABET[byte]


            def _encode_triplet(first, second, third):
                chars = [
                    first >> 2,
                    ((first & 0x3) << 4) | (second >> 4),
                    ((second & 0xF) << 2) | (third >> 6),
                    third & 0x3F,
                ]
                return "".join(_encode_char(char) for char in chars)


            def encode(text):
                compressed = zlib.compress(text.encode("utf-8"))[2:-4]
                padded = compressed + b"\x00" * (-len(compressed) % 3)
                return "".join(
                    _encode_triplet(padded[i], padded[i + 1], padded[i + 2])
                    for i in range(0, len(padded), 3)
                )


            def diagram_url(code, server=SERVER_URL, fmt="svg"):
                return f"{server}/{fmt}/{encode(code)}"


            def puml(code, server=None, fmt="svg", timeout=30, width="100%"):
                from IPython.display import HTML

                request = urllib.request.Request(
                    diagram_url(code, server=server or SERVER_URL, fmt=fmt),
                    headers={"User-Agent": "home-prov-puml/1.0"},
                )
                with urllib.request.urlopen(request, timeout=timeout) as response:
                    svg = response.read().decode("utf-8")
                svg = svg.replace(
                    "<svg ",
                    '<svg style="display:block;width:100%;height:auto;" ',
                    1,
                )
                return HTML(
                    f'<div style="display:block;width:{width};'
                    'max-width:100%;overflow-x:auto;margin:0.5em 0;">'
                    f"{svg}</div>"
                )


            def load_ipython_extension(ipython):
                from IPython.core.magic import register_cell_magic

                @register_cell_magic
                def puml_magic(line, cell):
                    return puml(cell)

                ipython.register_magic_function(puml_magic, magic_kind="cell", magic_name="puml")
    scheduling:
      userScheduler:
        enabled: false
      userPlaceholder:
        enabled: false
    prePuller:
      hook:
        enabled: false
      continuous:
        enabled: false
    cull:
      enabled: true
      timeout: 3600
      every: 600
    ingress:
      enabled: false
    httpRoute:
      enabled: false

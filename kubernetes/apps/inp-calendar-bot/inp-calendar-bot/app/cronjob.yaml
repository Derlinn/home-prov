---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inp-calendar-bot-updater
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          serviceAccountName: inp-calendar-bot-updater
          restartPolicy: OnFailure
          volumes:
            - name: docker-auth
              secret:
                secretName: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: updater
              # bitnami/kubectl no longer publishes version tags on Docker Hub
              # since the move to Bitnami Secure Images: only digests remain, so
              # nothing pinnable. alpine/kubectl provides the shell, curl, grep
              # and cut the script below relies on.
              image: alpine/kubectl:1.36.3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  NAMESPACE=inp-calendar-bot
                  DEPLOYMENT=inp-calendar-bot
                  CONFIGMAP=inp-calendar-bot-image-digest

                  # Extract auth (base64 of user:token) directly from pull secret
                  AUTH_B64=$(grep -o '"auth":"[^"]*"' /docker-auth/.dockerconfigjson | cut -d'"' -f4)

                  # Token exchange
                  TOKEN=$(curl -sf \
                    -H "Authorization: Basic $AUTH_B64" \
                    "https://ghcr.io/token?scope=repository:akt0o/inp-calendar-bot:pull&service=ghcr.io" \
                    | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

                  # Get remote manifest digest (accept OCI index for multi-arch images)
                  REMOTE_DIGEST=$(curl -sfI \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
                    "https://ghcr.io/v2/akt0o/inp-calendar-bot/manifests/latest" \
                    | grep -i "^docker-content-digest:" | tr -d '\r' | awk '{print $2}')

                  if [ -z "$REMOTE_DIGEST" ]; then
                    echo "ERROR: could not fetch remote digest"
                    exit 1
                  fi

                  # Get last known digest from ConfigMap
                  STORED_DIGEST=$(kubectl get configmap "$CONFIGMAP" -n "$NAMESPACE" \
                    -o jsonpath='{.data.digest}' 2>/dev/null || echo "")

                  echo "Remote: $REMOTE_DIGEST"
                  echo "Stored: $STORED_DIGEST"

                  if [ "$REMOTE_DIGEST" = "$STORED_DIGEST" ]; then
                    echo "Image up to date, nothing to do."
                    exit 0
                  fi

                  echo "New image detected, restarting deployment..."
                  kubectl rollout restart deployment/"$DEPLOYMENT" -n "$NAMESPACE"

                  # Persist new digest
                  kubectl create configmap "$CONFIGMAP" -n "$NAMESPACE" \
                    --from-literal=digest="$REMOTE_DIGEST" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  echo "Done. Digest updated to $REMOTE_DIGEST"
              volumeMounts:
                - name: docker-auth
                  mountPath: /docker-auth
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

---
# Flux impersonates this when applying ./inp-calendar-bot/app, co-owned by an
# outside contributor. Otherwise it applies as cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-inp-calendar-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-inp-calendar-bot
rules:
  # Only the kinds the app actually ships. Anything else fails at apply.
  - apiGroups: [""]
    resources:
      - configmaps
      - persistentvolumeclaims
      - secrets
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only, for the `wait: true` health check: kstatus walks a Deployment
  # down to its ReplicaSets and Pods to decide whether the rollout is done.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-inp-calendar-bot
subjects:
  - kind: ServiceAccount
    name: flux-inp-calendar-bot
roleRef:
  kind: Role
  name: flux-inp-calendar-bot
  apiGroup: rbac.authorization.k8s.io

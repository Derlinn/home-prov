---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inp-calendar-rs
  labels:
    app.kubernetes.io/name: inp-calendar-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inp-calendar-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inp-calendar-rs
    spec:
      containers:
        - name: inp-calendar-rs
          image: ghcr.io/akt0o/inp-calendar-rs:v0.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
            - name: DATA_DIR
              value: /app/data
            - name: CALENDAR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: inp-calendar-rs-secret
                  key: GRENOBLE_USERNAME
            - name: CALENDAR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inp-calendar-rs-secret
                  key: GRENOBLE_PASSWORD
            - name: CALENDAR_URL
              valueFrom:
                secretKeyRef:
                  name: inp-calendar-rs-secret
                  key: CALENDAR_URL
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: inp-calendar-rs-secret
                  key: TOKEN
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inp-calendar-rs-data

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inp-calendar-rs
  labels:
    app.kubernetes.io/name: inp-calendar-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inp-calendar-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inp-calendar-rs
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: inp-calendar-rs
          image: ghcr.io/akt0o/inp-calendar-rs:v0.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          envFrom:
            - secretRef:
                name: inp-calendar-rs-secret
          env:
            - name: TZ
              value: Europe/Paris
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inp-calendar-rs-data

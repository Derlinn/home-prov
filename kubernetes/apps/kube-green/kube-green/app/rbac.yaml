---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-clusterrolebinding.json
# kube-green ships the ClusterRole but binds it to nothing. Without this, the
# TokenReview succeeds and the SubjectAccessReview then denies /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-green-metrics-reader-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-green-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: observability

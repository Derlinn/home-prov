apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      version: '1.12.0'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: longhorn
  releaseName: longhorn
  interval: 1h
  # No remediation on purpose. Longhorn does not support downgrades, so an
  # automatic rollback of a failed upgrade would leave the storage layer in a
  # state its own pre-upgrade hook refuses to work with. A failed Longhorn
  # upgrade has to be looked at by a human.
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      orphanResourceAutoDeletion: "replica-data"
      defaultReplicaCount: 1
      concurrentAutomaticEngineUpgradePerNodeLimit: 3 # for upgrade of volume engine
    ingress:
      enabled: true
      host: longhorn.linderis.fr
    metrics:
      serviceMonitor:
        enabled: true
  dependsOn:
    - name: envoy-gateway
      namespace: network

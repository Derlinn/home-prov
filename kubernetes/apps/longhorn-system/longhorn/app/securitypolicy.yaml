---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Longhorn has no authentication of its own.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-dashboard
  oidc:
    provider:
      issuer: https://authentik.${DOMAIN}/application/o/longhorn/
      # Pinned, not discovered: the issuer's trailing slash doubles in the URL.
      authorizationEndpoint: https://authentik.${DOMAIN}/application/o/authorize/
      tokenEndpoint: https://authentik.${DOMAIN}/application/o/token/
      endSessionEndpoint: https://authentik.${DOMAIN}/application/o/longhorn/end-session/
    clientID: longhorn
    clientSecret:
      name: longhorn-oidc
    redirectURL: https://longhorn.${DOMAIN}/oauth2/callback
    logoutPath: /logout
    scopes: ["openid", "email", "profile"]

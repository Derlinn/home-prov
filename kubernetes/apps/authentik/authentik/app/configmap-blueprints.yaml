---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
data:
  # Authentik's own config lives in PostgreSQL and is otherwise unreproducible
  # from Git. References use !Find rather than the UUIDs `ak export_blueprint`
  # emits, which differ on every install.
  #
  # Each application declares its own linderis_* group and binds it in the same
  # blueprint. Authentik walks the blueprint directory unsorted and applies one
  # async task per file, so a cross-file reference may resolve before its target
  # exists — and an application left with no binding is open to every account.
  # Group membership itself stays managed in the UI, except linderis_admin whose
  # members are pinned in admin.yaml.
  admin.yaml: |
    version: 1
    metadata:
      name: admin
    entries:
      # Redeclared here only so !KeyOf resolves within this file. `created`
      # never touches an object that already exists, so the per-application
      # blueprints remain the sole owners of these groups.
      - model: authentik_core.group
        id: g-rackula
        state: created
        identifiers:
          name: linderis_rackula
      - model: authentik_core.group
        id: g-grafana
        state: created
        identifiers:
          name: linderis_grafana
      - model: authentik_core.group
        id: g-grafana-admins
        state: created
        identifiers:
          name: Grafana Admins
      - model: authentik_core.group
        id: g-jellyfin
        state: created
        identifiers:
          name: linderis_jellyfin
      - model: authentik_core.group
        id: g-home-assistant
        state: created
        identifiers:
          name: linderis_home_assistant
      - model: authentik_core.group
        id: g-home-assistant-admins
        state: created
        identifiers:
          name: linderis_home_assistant_admins
      - model: authentik_core.group
        id: g-gatus
        state: created
        identifiers:
          name: linderis_gatus
      - model: authentik_core.group
        id: g-netbox
        state: created
        identifiers:
          name: linderis_netbox
      - model: authentik_core.group
        id: g-jellyseerr
        state: created
        identifiers:
          name: linderis_jellyseerr
      - model: authentik_core.group
        id: g-vaultwarden
        state: created
        identifiers:
          name: linderis_vaultwarden
      - model: authentik_core.group
        id: g-longhorn
        state: created
        identifiers:
          name: linderis_longhorn
      - model: authentik_core.group
        id: g-prometheus
        state: created
        identifiers:
          name: linderis_prometheus
      - model: authentik_core.group
        id: g-maigret
        state: created
        identifiers:
          name: linderis_maigret
      - model: authentik_core.group
        id: g-social-analyzer
        state: created
        identifiers:
          name: linderis_social_analyzer
      # Membership in a child counts as membership in every parent, so this one
      # group satisfies every application binding without adding a binding of
      # its own. The role groups are parents too: authentik emits inherited
      # names in the `groups` claim, which is what Grafana and Home Assistant
      # read to pick a role.
      #
      # `users` is authoritative — anyone added to this group through the UI is
      # dropped on the next reconcile.
      - model: authentik_core.group
        state: present
        identifiers:
          name: linderis_admin
        attrs:
          is_superuser: false
          users:
            - !Find [authentik_core.user, [username, theo]]
          parents:
            - !KeyOf g-rackula
            - !KeyOf g-grafana
            - !KeyOf g-grafana-admins
            - !KeyOf g-jellyfin
            - !KeyOf g-home-assistant
            - !KeyOf g-home-assistant-admins
            - !KeyOf g-gatus
            - !KeyOf g-netbox
            - !KeyOf g-jellyseerr
            - !KeyOf g-vaultwarden
            - !KeyOf g-longhorn
            - !KeyOf g-prometheus
            - !KeyOf g-maigret
            - !KeyOf g-social-analyzer
  rackula.yaml: |
    version: 1
    metadata:
      name: rackula
    entries:
      - model: authentik_core.group
        id: rackula-group
        state: present
        identifiers:
          name: linderis_rackula
        attrs:
          is_superuser: false
      - model: authentik_providers_oauth2.oauth2provider
        id: rackula-provider
        state: present
        identifiers:
          name: Provider for Rackula
        attrs:
          client_id: rackula-web
          client_secret: !Env AUTHENTIK_RACKULA_CLIENT_SECRET
          client_type: confidential
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          authorization_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-authorization-explicit-consent]
          invalidation_flow: !Find
            - authentik_flows.flow
            - [slug, default-provider-invalidation-flow]
          signing_key: !Find
            - authentik_crypto.certificatekeypair
            - [name, authentik Self-signed Certificate]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            # /oauth2/callback is the Envoy Gateway SecurityPolicy; /auth/callback
            # is Rackula's own, kept for the day upstream #3140 is fixed.
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://rackula.${DOMAIN}/oauth2/callback
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://rackula.${DOMAIN}/auth/callback
      - model: authentik_core.application
        id: rackula-app
        state: present
        identifiers:
          slug: rackula
        attrs:
          name: Rackula
          provider: !KeyOf rackula-provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf rackula-app
          group: !KeyOf rackula-group
        attrs:
          order: 0
          enabled: true
  grafana.yaml: |
    version: 1

          provider: !KeyOf jellyfin-provider
          policy_engine_mode: any
          meta_launch_url: https://jellyfin.${DOMAIN}/sso/OID/start/authentik
  home-assistant.yaml: |
    version: 1
    metadata:
      name: home-assistant
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: home-assistant-provider
        state: present
        identifiers:
          name: Provider for home-assistant
        attrs:
          client_id: fu9wSbcb6PV8DQxH28Nh0oUSQgBah27Hv2VDC34a
          client_type: public
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          issuer_mode: per_provider
          authorization_flow: !Find

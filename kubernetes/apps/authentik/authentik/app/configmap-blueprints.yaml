        state: present
        identifiers:
          target: !KeyOf home-assistant-app
          group: !KeyOf home-assistant-group
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf home-assistant-app
          group: !KeyOf home-assistant-admins-group

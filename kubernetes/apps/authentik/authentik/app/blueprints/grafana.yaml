# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: grafana
entries:
  # Only linderis_grafana grants access; the other two just pick a role.
  - model: authentik_core.group
    id: grafana-group
    state: present
    identifiers:
      name: linderis_grafana
    attrs:
      is_superuser: false
  - model: authentik_core.group
    state: present
    identifiers:
      name: Grafana Admins
    attrs:
      is_superuser: false
  - model: authentik_core.group
    state: present
    identifiers:
      name: Grafana Editors
    attrs:
      is_superuser: false
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    state: present
    identifiers:
      name: Provider for Grafana
    attrs:
      client_id: SFBLbR91wSTxSv4FVfucopcnQ1eIDCTdurohbpQ9
      client_secret: !Env AUTHENTIK_GRAFANA_CLIENT_SECRET
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://grafana.${DOMAIN}/login/generic_oauth
  - model: authentik_core.application
    id: grafana-app
    state: present
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      policy_engine_mode: any
      icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg
      group: Infrastructure
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grafana-app
      group: !KeyOf grafana-group
    attrs:
      order: 0
      enabled: true

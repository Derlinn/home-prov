---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 15m
  timeout: 10m
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      version: 2026.8.0
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 15m
  valuesFrom:
    - kind: Secret
      name: authentik-credentials
      valuesKey: secret-key
      targetPath: authentik.secret_key
      optional: false
    - kind: Secret
      name: authentik-credentials
      valuesKey: postgresql-password
      targetPath: authentik.postgresql.password
      optional: false
  values:
    global:
      env:
        - name: AUTHENTIK_RACKULA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: rackula-client-secret
        - name: AUTHENTIK_GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: grafana-client-secret
        - name: AUTHENTIK_JELLYFIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: jellyfin-client-secret
        - name: AUTHENTIK_GATUS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: gatus-client-secret
        - name: AUTHENTIK_NETBOX_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: netbox-client-secret
        - name: AUTHENTIK_JELLYSEERR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: jellyseerr-client-secret
        - name: AUTHENTIK_VAULTWARDEN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: vaultwarden-client-secret
        - name: AUTHENTIK_LONGHORN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: longhorn-client-secret
        - name: AUTHENTIK_PROMETHEUS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: prometheus-client-secret
        - name: AUTHENTIK_MAIGRET_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: maigret-client-secret
        - name: AUTHENTIK_SOCIAL_ANALYZER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: social-analyzer-client-secret

    blueprints:
      configMaps:
        - authentik-blueprints

    authentik:
      error_reporting:
        enabled: false
      log_level: info
      postgresql:
        host: authentik-db
        port: 5432
        name: authentik
        user: authentik
      redis:
        host: authentik-redis-master

    server:
      replicas: 1
      ingress:
        enabled: false
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    worker:
      replicas: 1
      # Blueprint discovery only runs hourly and misses kubelet's symlink swap.
      deploymentAnnotations:
        configmap.reloader.stakater.com/reload: authentik-blueprints


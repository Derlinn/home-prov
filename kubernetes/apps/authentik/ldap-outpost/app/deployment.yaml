---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap-outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ldap-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ldap-outpost
    spec:
      containers:
        - name: ldap
          # Must track the authentik server version exactly: the core rejects
          # outposts whose version diverges from its own.
          image: ghcr.io/goauthentik/ldap:2026.8.0
          env:
            - name: AUTHENTIK_HOST
              value: http://authentik-server.authentik.svc.cluster.local
            # Plain HTTP inside the cluster, so no certificate to verify.
            - name: AUTHENTIK_INSECURE
              value: "true"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ldap-outpost
                  key: token
          ports:
            - name: ldap
              containerPort: 3389
              protocol: TCP
            - name: ldaps
              containerPort: 6636
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

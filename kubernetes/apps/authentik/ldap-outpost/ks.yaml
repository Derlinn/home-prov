---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ldap-outpost
spec:
  dependsOn:
    - name: authentik
  interval: 1h
  path: ./kubernetes/apps/authentik/ldap-outpost/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: authentik
  wait: true
  timeout: 5m

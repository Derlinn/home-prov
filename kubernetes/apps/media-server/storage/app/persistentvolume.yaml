---
# Whole NAS share, not a subfolder: media/ and downloads/ must sit under one
# mount for hardlinks to work. Expects media/{movies,tv} and downloads/.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-server-nas-data
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: lin-nas-01.${DOMAIN}
    path: /volume1/Media/arr
  mountOptions:
    - nfsvers=4.1
    - hard
    - intr
    - rsize=1048576
    - wsize=1048576
    - timeo=600
    - retrans=2
  claimRef:
    namespace: media-server
    name: media-server-nas-data

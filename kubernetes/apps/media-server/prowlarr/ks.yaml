---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-server-prowlarr
spec:
  interval: 1h
  path: ./kubernetes/apps/media-server/prowlarr/app
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media-server
  dependsOn:
    - name: media-server-storage
    - name: media-server-vpn-stack
  wait: true
  timeout: 10m

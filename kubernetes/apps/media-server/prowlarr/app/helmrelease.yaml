---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Prowlarr - HTTP/HTTPS traffic routed through the vpn-stack gluetun proxy.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: prowlarr
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: 2.5.2
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Europe/Paris"
              HTTP_PROXY: "${VPN_PROXY}"
              HTTPS_PROXY: "${VPN_PROXY}"
              NO_PROXY: "${NO_PROXY_CLUSTER},${DOMAIN},.${DOMAIN}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    service:
      main:
        controller: main
        ports:
          http:
            port: 9696

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 256Mi
        globalMounts:
          - path: /config

    defaultPodOptions:
      labels:
        vpn-proxy-client: "true"
        egress: vpn-only

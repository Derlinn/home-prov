---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clamav
spec:
  namespaceSelector:
    matchNames:
      - media-server
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /

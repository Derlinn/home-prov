---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# nodriver/Chrome does not reliably honour HTTP_PROXY. If the Cloudflare bypass
# fails, move this into the vpn-stack pod to share gluetun's netns outright.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: flaresolverr
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: alexfozor/flaresolverr
              tag: pr-1300-experimental
            securityContext:
              capabilities:
                add:
                  - SYS_ADMIN
              seccompProfile:
                type: Unconfined
            env:
              LOG_LEVEL: "info"
              LOG_HTML: "false"
              CAPTCHA_SOLVER: "none"
              TZ: "Europe/Paris"
              LANG: "en_GB"
              DRIVER: "nodriver"
              HTTP_PROXY: "${VPN_PROXY}"
              HTTPS_PROXY: "${VPN_PROXY}"
              NO_PROXY: "${NO_PROXY_CLUSTER},${DOMAIN},.${DOMAIN}"

    service:
      main:
        controller: main
        ports:
          http:
            port: 8191

    defaultPodOptions:
      labels:
        vpn-proxy-client: "true"

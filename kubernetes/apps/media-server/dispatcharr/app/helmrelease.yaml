---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Dispatcharr (mode aio — Redis embarqué) — trafic HTTP/HTTPS via proxy gluetun.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dispatcharr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: dispatcharr
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Europe/Paris"
              DISPATCHARR_ENV: "aio"
              REDIS_HOST: "localhost"
              CELERY_BROKER_URL: "redis://localhost:6379/0"
              DISPATCHARR_LOG_LEVEL: "info"
              HTTP_PROXY: "${VPN_PROXY}"
              HTTPS_PROXY: "${VPN_PROXY}"
              NO_PROXY: "${NO_PROXY_CLUSTER},${DOMAIN},.${DOMAIN}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    service:
      main:
        controller: main
        ports:
          http:
            port: 9191

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 256Mi
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 256Mi
        globalMounts:
          - path: /data

    defaultPodOptions:
      labels:
        vpn-proxy-client: "true"

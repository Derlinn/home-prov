---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-drive-scripts
  namespace: media-server
data:
  exclude.txt: |
    Download/
    Media/
    Music/
    Docker/
    Web/
    *.partial
    *.tmp
    Thumbs.db
    .DS_Store
    @eaDir/
    *#Recycle*
    *.socket
  run.sh: |
    #!/bin/sh
    set -euo pipefail
    export PATH="/shared:$PATH"
    export RESTIC_CACHE_DIR=/cache
    SOURCES="/nas/famille /nas/photos /nas/public /nas/homes /nas/backups"
    RESTIC_HOST="nas-selectif"
    RETENTION="--keep-last 4 --keep-weekly 8 --keep-monthly 6"
    RCLONE_CONF_DIR="/root/.config/rclone"
    : "$MODE" "$RCLONE_CONFIG_DRIVE_TOKEN" "$RCLONE_CONFIG_DRIVE_CLIENT_ID" "$RCLONE_CONFIG_DRIVE_CLIENT_SECRET"
    case "$RCLONE_CONFIG_DRIVE_TOKEN" in
      '{"access_token"'*) ;;
      *) echo "RCLONE_CONFIG_DRIVE_TOKEN is not a JSON token object" >&2; exit 1 ;;
    esac
    mkdir -p "$RCLONE_CONF_DIR"
    printf '[drive]\ntype = drive\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
      "$RCLONE_CONFIG_DRIVE_CLIENT_ID" \
      "$RCLONE_CONFIG_DRIVE_CLIENT_SECRET" \
      "$RCLONE_CONFIG_DRIVE_TOKEN" > "$RCLONE_CONF_DIR/rclone.conf"
    chmod 600 "$RCLONE_CONF_DIR/rclone.conf"
    export RCLONE_CONFIG="$RCLONE_CONF_DIR/rclone.conf"
    unlock() {
      restic unlock || true
    }
    ensure_repo() {
      restic snapshots >/dev/null 2>&1 || restic init
    }
    case "$MODE" in
      backup)
        unlock
        ensure_repo
        # shellcheck disable=SC2086
        restic backup --no-scan --host "$RESTIC_HOST" --exclude-file=/scripts/exclude.txt --tag nas --tag selective $SOURCES
        case $(date +%d) in
          0[1-7]) restic check --read-data ;;
          *) restic check --read-data-subset=10% ;;
        esac
        # shellcheck disable=SC2086
        restic forget --host "$RESTIC_HOST" --prune $RETENTION
        ;;
      *)
        echo "unknown MODE: $MODE" >&2
        exit 1
        ;;
    esac

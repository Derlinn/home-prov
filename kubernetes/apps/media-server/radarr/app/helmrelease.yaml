---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: radarr
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/radarr
              tag: 6.3.0
            env:
              PUID: "1001"
              PGID: "1001"
              TZ: "Europe/Paris"
              HTTP_PROXY: "${VPN_PROXY}"
              HTTPS_PROXY: "${VPN_PROXY}"
              NO_PROXY: "${NO_PROXY_CLUSTER},${DOMAIN},.${DOMAIN}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    service:
      main:
        controller: main
        ports:
          http:
            port: 7878

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 500Mi
        globalMounts:
          - path: /config
      data:
        existingClaim: media-server-nas-data
        globalMounts:
          - path: /data # whole share mounted so hardlinks work (downloads + media)

    defaultPodOptions:
      labels:
        vpn-proxy-client: "true"
        egress: vpn-only

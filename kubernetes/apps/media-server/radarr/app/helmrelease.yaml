---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: radarr
  interval: 1h
  values:
    controllers:
      main:
        initContainers:
          disable-auth:
            image:
              repository: alpine
              tag: "3.24"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                CONFIG=/config/config.xml
                if [ ! -f "$CONFIG" ]; then
                  echo "No $CONFIG yet, skipping native auth disable (first run)"
                  exit 0
                fi
                echo "Disabling native auth in $CONFIG (OIDC at gateway)"
                if grep -q "<AuthenticationMethod>" "$CONFIG"; then
                  sed -i 's|<AuthenticationMethod>.*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|' "$CONFIG"
                else
                  sed -i 's|</Config>|  <AuthenticationMethod>External</AuthenticationMethod>\n</Config>|' "$CONFIG"
                fi
                if grep -q "<AuthenticationRequired>" "$CONFIG"; then
                  sed -i 's|<AuthenticationRequired>.*</AuthenticationRequired>|<AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>|' "$CONFIG"
                else
                  sed -i 's|</Config>|  <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>\n</Config>|' "$CONFIG"
                fi
                echo "Patched $CONFIG:"
                grep -E "Authentication" "$CONFIG" || true
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/radarr
              tag: 6.3.0
            env:
              PUID: "1001"
              PGID: "1001"
              TZ: "Europe/Paris"
              HTTP_PROXY: "${VPN_PROXY}"
              HTTPS_PROXY: "${VPN_PROXY}"
              NO_PROXY: "${NO_PROXY_CLUSTER},${DOMAIN},.${DOMAIN}"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    service:
      main:
        controller: main
        ports:
          http:
            port: 7878

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 500Mi
        globalMounts:
          - path: /config
      data:
        existingClaim: media-server-nas-data
        globalMounts:
          - path: /data # whole share mounted so hardlinks work (downloads + media)

    defaultPodOptions:
      labels:
        vpn-proxy-client: "true"
        egress: vpn-only

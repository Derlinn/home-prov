---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Pod unique : gluetun (VPN) + qbittorrent partagent le même namespace réseau.
# Équivalent K8s de network_mode: "service:gluetun".
#
# Gluetun expose également un proxy HTTP sur :8888 utilisé par les autres apps
# (prowlarr, bazarr, flaresolverr, dispatcharr) via HTTP_PROXY — 1 seule connexion ProtonVPN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-stack
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: vpn-stack
  interval: 1h
  timeout: 10m
  values:
    controllers:
      main:
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: latest
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            env:
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: Netherlands
              PORT_FORWARD_ONLY: "on"
              WIREGUARD_MTU: "1200"
              VPN_PORT_FORWARDING: "on"
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              UPDATER_PERIOD: "24h"
              DOT: "off"
              DNS_ADDRESS: "1.1.1.1"
              FIREWALL_OUTBOUND_SUBNETS: "10.25.0.0/16,10.42.0.0/16,10.43.0.0/16,192.168.0.0/16"
              # Proxy HTTP sur :8888 — utilisé par prowlarr/bazarr/flaresolverr/dispatcharr
              BLOCK_IPV6: "on"
              # Permettre l'accès entrant aux ports qbittorrent et proxy HTTP
              FIREWALL_INPUT_PORTS: "8080,8888"
              WIREGUARD_ALLOWED_IPS: "0.0.0.0/0"
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              HEALTH_TARGET_ADDRESS: "1.1.1.1:443"
            envFrom:
              - secretRef:
                  name: gluetun-credentials

          port-sync:
            image:
              repository: alpine
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                PORT_FILE=/tmp/gluetun/forwarded_port
                sleep 30
                while true; do
                  if [ -f "$PORT_FILE" ]; then
                    PORT=$(cat "$PORT_FILE")
                    if [ -n "$PORT" ]; then
                      CURRENT=$(wget -qO- --timeout=5 "http://127.0.0.1:8080/api/v2/app/preferences" 2>/dev/null | grep -o '"listen_port":[0-9]*' | grep -o '[0-9]*$')
                      if [ -n "$CURRENT" ] && [ "$CURRENT" != "$PORT" ]; then
                        wget -qO- --timeout=5 \
                          --post-data "json={\"listen_port\":${PORT}}" \
                          "http://127.0.0.1:8080/api/v2/app/setPreferences" >/dev/null && \
                        echo "[port-sync] updated qBittorrent listen_port $CURRENT -> $PORT"
                      fi
                    fi
                  fi
                  sleep 30
                done

          qbittorrent:
            image:
              repository: lscr.io/linuxserver/qbittorrent
              tag: libtorrentv1
            env:
              PUID: "1001"
              PGID: "1001"
              TZ: "Europe/Paris"
              WEBUI_PORT: "8080"
              UMASK: "002"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
            dependsOn: gluetun

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080        # qbittorrent web UI
          http-proxy:
            port: 8888        # gluetun HTTP proxy

    persistence:
      gluetun-data:
        type: emptyDir
        advancedMounts:
          main:
            gluetun:
              - path: /tmp/gluetun
            port-sync:
              - path: /tmp/gluetun
                readOnly: true
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        globalMounts:
          - path: /dev/net/tun
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 500Mi
        advancedMounts:
          main:
            qbittorrent:
              - path: /config
      data:
        existingClaim: media-server-nas-data
        advancedMounts:
          main:
            qbittorrent:
              - path: /data

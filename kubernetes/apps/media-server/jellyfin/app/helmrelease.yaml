---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chart:
    spec:
      chart: jellyfin
      version: '2.7.0'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media-server
  releaseName: jellyfin
  interval: 1h
  values:
    image:
      repository: lscr.io/linuxserver/jellyfin
      tag: 10.11.11

    # RollingUpdate briefly runs two pods against the same SQLite library on a
    # RWO PVC, surfacing as `SQLite Error 10: disk I/O error`.
    deploymentStrategy:
      type: Recreate

    env:
      TZ: "Europe/Paris"
      PUID: "1000"
      PGID: "1000"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN}"

    persistence:
      config:
        enabled: true
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 20Gi
      media:
        enabled: true
        existingClaim: media-server-nas-data
        mountPath: /media
        subPath: media
      transcodes:
        enabled: true
        type: emptyDir
        mountPath: /config/cache/transcodes

    ingress:
      enabled: false   # on utilise HTTPRoute (Envoy Gateway)

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

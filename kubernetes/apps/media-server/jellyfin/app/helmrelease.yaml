---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chart:
    spec:
      chart: jellyfin
      version: '2.7.0'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media-server
  releaseName: jellyfin
  interval: 1h
  values:
    image:
      repository: lscr.io/linuxserver/jellyfin
      tag: 10.11.11

    deploymentStrategy:
      type: Recreate

    env:
      TZ: "Europe/Paris"
      PUID: "1000"
      PGID: "1000"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN}"

    persistence:
      config:
        enabled: true
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 20Gi
      media:
        enabled: true
        existingClaim: media-server-nas-data
        mountPath: /media
        subPath: media

    volumes:
      - name: transcodes
        emptyDir: {}
      # AMD iGPU render node for VAAPI hardware transcoding. Only lin-node-01/02/03
      # have the amdgpu kernel module loaded (see talos-base-controlplane.yaml).
      # Must be CharDevice (not a Directory mount of /dev/dri): only that type
      # makes containerd add the matching device-cgroup allow rule, otherwise
      # the file is visible but open()/ioctl() fails with -EPERM.
      - name: render
        hostPath:
          path: /dev/dri/renderD128
          type: CharDevice
    volumeMounts:
      - name: transcodes
        mountPath: /config/cache/transcodes
      - name: render
        mountPath: /dev/dri/renderD128

    # podSecurityContext.supplementalGroups does NOT reach the jellyfin process:
    # the linuxserver.io image's own entrypoint drops from root to PUID/PGID via
    # its own group lookup, which discards any GID Kubernetes injected that has
    # no name in the container's /etc/group. Their init script only special-cases
    # /dev/dri/card0 (owned by group root here) to grant it to the app user; it
    # never touches renderD128, which the host udev rule puts in a separate,
    # unnamed GID 105. Net effect: every VAAPI init on renderD128 failed with
    # "Device creation failed" (trickplay AND real hw transcode), 100% of the
    # time, silently falling back to remux/software encode. Confirmed by
    # reproducing the exact failure with the real jellyfin process's actual
    # runtime groups (0,100,911 - no 105) and fixing it by regrouping the
    # device to root below, which the image's own logic already trusts.
    initContainers:
      - name: fix-render-node-group
        image: busybox:1.38
        command:
          - sh
          - -c
          - chgrp 0 /dev/dri/renderD128 && chmod 660 /dev/dri/renderD128
        volumeMounts:
          - name: render
            mountPath: /dev/dri/renderD128

    # A CharDevice hostPath mount alone isn't enough here: containerd doesn't
    # auto-add the render node to the container's device-cgroup allow list, so
    # open() fails with EPERM even as root with the matching GID. privileged
    # is required to actually use the device; the namespace already allows it
    # for Gluetun's /dev/net/tun.
    securityContext:
      privileged: true

    # Only these 3 nodes are real bare metal with the AMD iGPU passed through;
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - lin-node-01
                    - lin-node-02
                    - lin-node-03

    ingress:
      enabled: false

    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        memory: 4Gi

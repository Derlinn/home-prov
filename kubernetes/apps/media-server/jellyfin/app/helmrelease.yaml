---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chart:
    spec:
      chart: jellyfin
      version: '2.7.0'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media-server
  releaseName: jellyfin
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: lscr.io/linuxserver/jellyfin
      tag: 10.11.11

    # Jellyfin keeps its library in a SQLite file on a RWO PVC. With
    # RollingUpdate the new pod starts before the old one stops: on a
    # single-node cluster both mount the same volume and open the same
    # database, and the second process fails to create its -shm file, which
    # surfaces as `SQLite Error 10: disk I/O error` on every query.
    deploymentStrategy:
      type: Recreate

    env:
      TZ: "Europe/Paris"
      PUID: "1000"
      PGID: "1000"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.linderis.fr"

    persistence:
      config:
        enabled: true
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 20Gi
      media:
        enabled: true
        existingClaim: media-server-nas-data
        mountPath: /media
        subPath: media
      transcodes:
        enabled: true
        type: emptyDir
        mountPath: /config/cache/transcodes

    ingress:
      enabled: false   # on utilise HTTPRoute (Envoy Gateway)

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

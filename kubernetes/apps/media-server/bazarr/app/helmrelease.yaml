---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Bazarr — trafic HTTP/HTTPS routé via le proxy gluetun du vpn-stack.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: bazarr
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: 1.6.0
            env:
              PUID: "1001"
              PGID: "1001"
              TZ: "Europe/Paris"
              HTTP_PROXY: "${VPN_PROXY}"
              HTTPS_PROXY: "${VPN_PROXY}"
              # addic7ed and gestdown are reached from the home IP, not the VPN exit (4fb2b6c).
              NO_PROXY: "${NO_PROXY_CLUSTER},${DOMAIN},.${DOMAIN},addic7ed.com,.addic7ed.com,gestdown.info,.gestdown.info"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6767
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6767
                  initialDelaySeconds: 15
                  periodSeconds: 10

    service:
      main:
        controller: main
        ports:
          http:
            port: 6767

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 500Mi
        globalMounts:
          - path: /config
      data:
        existingClaim: media-server-nas-data
        globalMounts:
          - path: /data

    defaultPodOptions:
      labels:
        vpn-proxy-client: "true"
        egress: vpn-only

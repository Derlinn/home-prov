---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Bazarr — trafic HTTP/HTTPS routé via le proxy gluetun du vpn-stack.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media-server
  releaseName: bazarr
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Europe/Paris"
              HTTP_PROXY: "http://vpn-stack.media-server.svc.cluster.local:8888"
              HTTPS_PROXY: "http://vpn-stack.media-server.svc.cluster.local:8888"
              NO_PROXY: "10.0.0.0/8,192.168.0.0/16,media-server.svc.cluster.local"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6767
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6767
                  initialDelaySeconds: 15
                  periodSeconds: 10

    service:
      main:
        controller: main
        ports:
          http:
            port: 6767

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 500Mi
        globalMounts:
          - path: /config
      data:
        existingClaim: media-server-nas-data
        globalMounts:
          - path: /data

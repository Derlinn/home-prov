---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-server-gluetun-secret
  labels:
    flux.linderis.prod/sops-secret: "true"
spec:
  interval: 1h
  path: ./kubernetes/apps/media-server/gluetun-secret/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media-server
  wait: true
  timeout: 5m

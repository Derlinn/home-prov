---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home-automation
  releaseName: zigbee2mqtt
  interval: 1h
  values:
    controllers:
      main:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.13.0
            env:
              TZ: "Europe/Paris"
              ZIGBEE2MQTT_DATA: /app/data
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8080"
            envFrom:
              - secretRef:
                  name: zigbee2mqtt-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # GID 20 owns /dev/ttyUSB0 via the Talos udev rule, so Z2M stays non-root.
        supplementalGroups: [20]

    service:
      app:
        controller: main
        ports:
          http:
            port: 8080

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /app/data
      usb:
        type: hostPath
        hostPath: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_30ac0d4ec674ef11ae84c88c8fcc3fa0-if00-port0
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/ttyUSB0

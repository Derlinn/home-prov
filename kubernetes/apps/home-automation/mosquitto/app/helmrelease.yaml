---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# MQTT broker. Zigbee2MQTT publishes here, Home Assistant subscribes; neither
# talks to the Zigbee dongle directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home-automation
  releaseName: mosquitto
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.22
            env:
              TZ: "Europe/Paris"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        # The image runs as the mosquitto user; fsGroup lets it own the volume.
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: main
        ports:
          mqtt:
            port: 1883

    persistence:
      config:
        type: configMap
        name: mosquitto-config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      passwd:
        type: secret
        name: mosquitto-passwd
        globalMounts:
          - path: /mosquitto/config/passwd
            subPath: passwd
            readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 512Mi
        globalMounts:
          - path: /mosquitto/data

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    # Anonymous access is refused: MQTT carries the commands that switch the
    # rack's power outlet, so a stray client on the network is not acceptable.
    allow_anonymous false
    # Not the mounted Secret itself: mosquitto refuses a password file it does
    # not own, so an init container copies it here as uid 1883.
    password_file /mosquitto/auth/passwd

    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 60

    log_dest stdout
    # Declaring log_type replaces the default set instead of adding to it.
    # Without `information` the broker starts up completely silently, which
    # makes a healthy start indistinguishable from a broken one.
    log_type error
    log_type warning
    log_type notice
    log_type information

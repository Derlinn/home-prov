# Loads default set of integrations. Do not remove.
default_config:

# Packages are provided by the home-assistant-packages ConfigMap, mounted
# read-only on /config/packages. Edit them in Git, not through the UI.
homeassistant:
  packages: !include_dir_named packages
  # Absolute URLs built by integrations (OIDC redirect_uri, notifications).
  # Must match the HTTPRoute hostname, not the retired HAOS VM.
  external_url: "https://ha.${DOMAIN}"
  internal_url: "https://ha.${DOMAIN}"

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# An extra dashboard alongside the default one, which stays editable in the UI.
# This one is read-only by design: it comes from Git. Named after the plugs
# rather than energy, to avoid colliding with the built-in Energy dashboard.
lovelace:
  mode: storage
  dashboards:
    conso-prises:
      mode: yaml
      title: Conso prises
      icon: mdi:power-socket-fr
      show_in_sidebar: true
      filename: dashboards/conso-prises.yaml

# The http block used to set use_x_forwarded_for and trusted_proxies, needed
# because TLS is terminated by Envoy Gateway. Home Assistant migrated it to
# .storage/http and ignores the YAML since 2026.8, dropping it entirely in
# 2027.2. Those settings now live on the PVC, outside Git: manage them under
# Settings > System > Network.

auth_oidc:
  client_id: "fu9wSbcb6PV8DQxH28Nh0oUSQgBah27Hv2VDC34a"
  discovery_url: "https://authentik.${DOMAIN}/application/o/home-assistant/.well-known/openid-configuration"
  display_name: "Authentik"
  roles:
    admin: "linderis_home_assistant_admins"
    user: "linderis_home_assistant"
  features:
    # Reuses the existing local account instead of creating a fresh one.
    automatic_user_linking: true
    force_https: true

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home-automation
  releaseName: home-assistant
  interval: 1h
  values:
    controllers:
      main:
        # RWO Longhorn volume + SQLite: never let two pods mount /config at once.
        strategy: Recreate
        initContainers:
          # Installs hass-oidc-auth from Git rather than HACS, so the version
          # stays declarative. No shell variables: Flux substitutes ${...}.
          install-oidc:
            image:
              repository: alpine
              tag: "3.24"
            command:
              - /bin/sh
              - -c
              # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
              - |
                set -eu
                if grep -qx 1.1.1 /config/custom_components/auth_oidc/.installed_version 2>/dev/null; then
                  echo "auth_oidc 1.1.1 already installed"
                  exit 0
                fi
                rm -rf /config/custom_components/auth_oidc
                mkdir -p /config/custom_components/auth_oidc
                wget -qO /tmp/oidc.zip https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v1.1.1/hass-oidc-auth.zip
                unzip -q /tmp/oidc.zip -d /config/custom_components/auth_oidc
                echo 1.1.1 > /config/custom_components/auth_oidc/.installed_version
                echo "auth_oidc 1.1.1 installed"
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.9.1"
            env:
              TZ: "Europe/Paris"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: main
        ports:
          http:
            port: 8123

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      configuration:
        type: configMap
        name: home-assistant-configuration
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true

      packages:
        type: configMap
        name: home-assistant-packages
        globalMounts:
          - path: /config/packages
            readOnly: true

      secrets:
        type: secret
        name: home-assistant-secrets
        globalMounts:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
            readOnly: true

      dashboards:
        type: configMap
        name: home-assistant-dashboards
        globalMounts:
          - path: /config/dashboards
            readOnly: true

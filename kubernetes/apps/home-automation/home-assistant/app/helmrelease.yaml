---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chart:
    spec:
      chart: app-template
      version: '3.7.3'
      interval: 5h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home-automation
  releaseName: home-assistant
  interval: 1h
  values:
    controllers:
      main:
        # RWO Longhorn volume + SQLite: never let two pods mount /config at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.8.1"
            env:
              TZ: "Europe/Paris"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: main
        ports:
          http:
            port: 8123

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn-production-v1
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      configuration:
        type: configMap
        name: home-assistant-configuration
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true

      packages:
        type: configMap
        name: home-assistant-packages
        globalMounts:
          - path: /config/packages
            readOnly: true

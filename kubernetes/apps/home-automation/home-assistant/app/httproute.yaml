---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal gateway only: Home Assistant holds the controls of the outlet that
# powers the rack, and has no business being reachable from the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - ha.${DOMAIN}
  rules:
    - backendRefs:
        - name: home-assistant
          namespace: home-automation
          port: 8123

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal gateway only: Home Assistant holds the controls of the outlet that
# powers the rack, and has no business being reachable from the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  # HTTPS only: the `https-redirect` catch-all route on the gateway's `http`
  # listener sends port 80 traffic to HTTPS. Attaching this route to `http`
  # would shadow that catch-all (hostname match wins) and serve cleartext,
  # which breaks the OIDC redirect_uri scheme.
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - ha.${DOMAIN}
  rules:
    - backendRefs:
        - name: home-assistant
          namespace: home-automation
          port: 8123

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    # Global patch: Apply to ALL Kustomizations
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          deletionPolicy: WaitForTermination
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    remediation:
                      retries: 3
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    remediation:
                      retries: 3
                      remediateLastFailure: true
                  rollback:
                    cleanupOnFail: true
                    recreate: true
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # SOPS decryption for every child Kustomization, unconditionally.
    #
    # This used to be gated on a `sops-secret` label. Forgetting it produced no
    # error: the Secret was applied with its literal ENC[AES256_GCM,...] value,
    # and the app failed later for reasons that pointed nowhere near SOPS.
    # A Kustomization with no encrypted file simply ignores this block, so the
    # label bought nothing and cost a whole class of silent failures.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # Tenant isolation for directories co-owned by an outside contributor.
    #
    # Lives here rather than in the app's own ks.yaml, which sits in the
    # directory the contributor may edit.
    #
    # - serviceAccountName: apply as a namespace-scoped SA instead of
    #   kustomize-controller's cluster-admin.
    # - secretRef removed: keeps the age private key out of the tenant
    #   namespace, where any pod could mount it. kustomize-controller falls
    #   back to its --sops-age-secret key in flux-system.
    - patch: |-
        - op: remove
          path: /spec/decryption/secretRef
        - op: add
          path: /spec/serviceAccountName
          value: flux-inp-calendar-bot
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        name: inp-calendar-bot

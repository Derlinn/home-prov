---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Bootstrap root, reconciled from the FluxInstance `sync` block.
# Must stay outside ./kubernetes/apps: cluster-apps patches every Kustomization
# it builds, so reconciling itself would wipe its own spec.patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./cluster-apps-ks.yaml

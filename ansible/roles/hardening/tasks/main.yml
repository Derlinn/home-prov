- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - sudo
      - apparmor
      - apparmor-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove cleartext legacy services
  ansible.builtin.apt:
    name:
      - telnetd
      - tftpd
      - rsh-server
      - nis
    state: absent
    purge: true

- name: Harden sshd configuration
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -T -f %s
  notify: Reload sshd

- name: Configure fail2ban for sshd
  ansible.builtin.template:
    src: jail-local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure unattended-upgrades origins
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Deny all incoming traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow all outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Enable the firewall
  community.general.ufw:
    state: enabled

- name: Apply kernel hardening parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"
